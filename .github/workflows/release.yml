# Manual publish to npm (staged).
#
# Setup once: Repository -> Settings -> Secrets and variables -> Actions -> NPM_TOKEN
# (an npm token with publish access to @aurix-music/deezer).
#
# Tokens with 2FA bypass enabled can only write to a staging area, so `npm publish`
# fails with E_STAGE_REQUIRED. This job runs `npm stage publish` instead: the version
# is parked in Staged Packages on npmjs.com and a maintainer approves it with 2FA,
# which is what puts it on the registry under `latest`. The approval step is inherent
# to the token class — a runner cannot supply a one-time password.
#
# Provenance needs a public repository; on a private repo drop --provenance.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build, test and pack, skip the upload"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Stage release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm >= 11.15.0; the runner image ships 10.x.
      - name: Upgrade npm
        run: |
          npm install -g npm@11.15.0
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Stage package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm stage publish --access public --provenance
          fi
